name: Deploy to GitHub Pages

# Builds the site as a static export and publishes it to GitHub Pages
# (gosynapse.net).
# The docs (docs/, Astro Starlight) are built in the same job and served at /docs.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   WEB3FORMS_KEY      access key from web3forms.com (public by design; it maps
#                      to the recipient on their side)
#   TOUR_CODE_SHA256   printf %s '<code>' | shasum -a 256

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          NEXT_PUBLIC_TOUR_CODE_SHA256: ${{ vars.TOUR_CODE_SHA256 }}

      - name: Install docs
        run: pnpm --dir docs install --frozen-lockfile

      # Types and content schema, unit tests, then a build that generates the
      # error pages and refuses a dist/ with leaks or broken links.
      - name: Check, test and build docs
        run: |
          pnpm --dir docs check
          pnpm --dir docs test
          pnpm --dir docs build

      - name: Add docs at /docs
        run: |
          # Next exports a /docs page as out/docs.html (+ .txt), not out/docs/.
          if [ -e out/docs ] || [ -e out/docs.html ] || [ -e out/docs.txt ]; then
            echo "::error::The marketing site built its own /docs page; /docs belongs to docs/."
            exit 1
          fi
          cp -R docs/dist out/docs
          test -f out/docs/developers/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
